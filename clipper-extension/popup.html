<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand"><img src="icon32.png" alt=""><div><strong>UH Homes Clipper</strong><small id="brand-note">Save design inspirations</small></div><button id="open-settings" class="icon-button" title="Settings" aria-label="Settings">⚙</button></header>

  <section id="setup" hidden>
    <h2>Connect to UH Homes</h2>
    <label>App address<input id="setting-url" type="url" placeholder="https://your-app.onrender.com or http://127.0.0.1:5000"></label>
    <label>Clipper token<input id="setting-token" type="password" placeholder="Generate it in the app: Inspirations → Get the clipper"></label>
    <label class="check"><input id="setting-direct" type="checkbox"> Also allow fetching images in the browser (for sites that block the server)</label>
    <p class="note">The token identifies you to your workspace and expires after 90 days. No other credentials ever reach this extension.</p>
    <button id="save-settings" class="primary">Save &amp; connect</button>
    <p id="setup-status" class="note" role="status"></p>
  </section>

  <section id="clipper" hidden>
    <div class="page-line" id="page-title"></div>
    <div id="images" class="images" aria-label="Images on this page"></div>
    <p id="no-images" class="note" hidden>No images could be read on this page. Try the app's clip dialog with the page address instead.</p>
    <label>Title<input id="clip-title" type="text" maxlength="200"></label>
    <label>Collection<select id="clip-collection"></select></label>
    <label id="new-collection-row" hidden>New collection name<input id="clip-new-collection" type="text" maxlength="120" placeholder="Kitchen Inspirations"></label>
    <div class="actions">
      <button id="hover-mode" class="secondary" title="Adds a Save button when you hover images on the page">Hover save</button>
      <button id="clip-save" class="primary" disabled>Save to UH Homes</button>
    </div>
    <p id="clip-status" class="note" role="status"></p>
  </section>
</body>
<script src="popup.js"></script>
</html>
